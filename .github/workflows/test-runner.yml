name: Test Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check available tools
        run: |
          echo "=== System ==="
          uname -a
          echo "=== Docker ==="
          which docker 2>/dev/null && docker --version || echo "NO docker"
          echo "=== Podman ==="
          which podman 2>/dev/null && podman --version || echo "NO podman"
          echo "=== Buildah ==="
          which buildah 2>/dev/null && buildah --version || echo "NO buildah"
          echo "=== Node ==="
          which node 2>/dev/null && node --version || echo "NO node"
          echo "=== Sudo ==="
          sudo -n true 2>/dev/null && echo "HAS sudo" || echo "NO sudo"
          echo "=== Apt ==="
          which apt-get 2>/dev/null && echo "HAS apt" || echo "NO apt"
          echo "=== Docker socket ==="
          ls -la /var/run/docker.sock 2>/dev/null || echo "NO docker socket"
          echo "=== Env ==="
          env | sort
