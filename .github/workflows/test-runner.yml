name: Test Runner

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/test-runner.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Basic echo
        run: echo "Step 1 works"

      - name: Step 2 - Checkout
        uses: actions/checkout@v4

      - name: Step 3 - Check Docker
        run: |
          echo "Checking Docker..."
          which docker && docker --version || echo "DOCKER_NOT_FOUND"

      - name: Step 4 - Check tools
        run: |
          echo "Node: $(node --version 2>/dev/null || echo 'NOT_FOUND')"
          echo "NPM: $(npm --version 2>/dev/null || echo 'NOT_FOUND')"
          echo "Git: $(git --version 2>/dev/null || echo 'NOT_FOUND')"
          echo "Workspace: $(ls -la)"

      - name: Step 5 - Test docker login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin || echo "DOCKER_LOGIN_FAILED"

      - name: Step 6 - Test docker build
        run: |
          docker build -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-test:latest . || echo "DOCKER_BUILD_FAILED"
