name: Test Runner

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/test-runner.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo test
        run: |
          echo "Runner works!"
          echo "OS: $(uname -a)"
          docker --version || echo "Docker NOT available"
          echo "Done"
