name: Build App Image

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: git.unveiledsoftwaresolutions.com
  IMAGE: git.unveiledsoftwaresolutions.com/jariah/ateliercode-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest .
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

      - name: Update Helm values
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/tag: \".*\"/tag: \"${SHORT_SHA}\"/" helm/values.yaml

      - name: Commit and push
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add helm/values.yaml
          git diff --staged --quiet || git commit -m "chore: update app image tag to ${GITHUB_SHA::7} [skip ci]"
          git push
