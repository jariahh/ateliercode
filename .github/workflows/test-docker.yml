name: Test Docker

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test docker push with permissions
        run: |
          REPORT="ci-diagnostics.txt"
          {
            echo "=== Docker login ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin 2>&1
            echo ""

            echo "=== Build minimal test image ==="
            echo "FROM alpine:latest" > /tmp/Dockerfile.test
            docker build -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-app:ci-test -f /tmp/Dockerfile.test /tmp 2>&1
            echo "Build exit: $?"
            echo ""

            echo "=== Push test image ==="
            docker push git.unveiledsoftwaresolutions.com/jariah/ateliercode-app:ci-test 2>&1
            echo "Push exit: $?"
            echo ""

            echo "=== DONE ==="
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Commit report
        if: always()
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add ci-diagnostics.txt
          git diff --staged --quiet || git commit -m "ci: Push permission test report [skip ci]"
          git push || true
