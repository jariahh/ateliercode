name: Test Docker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test docker build
        run: |
          REPORT="ci-diagnostics.txt"
          {
            echo "=== Testing docker build for app ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin 2>&1
            echo ""
            echo "=== Dockerfile exists? ==="
            ls -la Dockerfile 2>&1
            echo ""
            echo "=== Dockerfile contents ==="
            cat Dockerfile 2>&1
            echo ""
            echo "=== Starting build ==="
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            docker build -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-app:test . 2>&1 || echo "BUILD FAILED with exit code $?"
            echo ""
            echo "=== Build complete ==="
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Commit report
        if: always()
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add ci-diagnostics.txt
          git diff --staged --quiet || git commit -m "ci: Docker build test report [skip ci]"
          git push || true
