name: Test Docker

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check environment and write report
        run: |
          REPORT="ci-diagnostics.txt"
          {
            echo "=== OS ==="
            cat /etc/os-release || true
            echo ""
            echo "=== whoami ==="
            whoami
            echo ""
            echo "=== Docker CLI ==="
            which docker && docker --version || echo "NO DOCKER CLI"
            echo ""
            echo "=== Docker socket ==="
            ls -la /var/run/docker.sock 2>/dev/null || echo "NO DOCKER SOCKET"
            echo ""
            echo "=== Docker info ==="
            docker info 2>&1 || echo "DOCKER INFO FAILED"
            echo ""
            echo "=== Docker ps ==="
            docker ps 2>&1 || echo "DOCKER PS FAILED"
            echo ""
            echo "=== Podman ==="
            which podman && podman --version || echo "NO PODMAN"
            echo ""
            echo "=== Buildah ==="
            which buildah && buildah --version || echo "NO BUILDAH"
            echo ""
            echo "=== Docker login test ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin 2>&1 || echo "DOCKER LOGIN FAILED"
            echo ""
            echo "=== env vars (docker/container) ==="
            env | grep -iE 'docker|container|runner' || echo "NO MATCHING ENV VARS"
            echo ""
            echo "=== disk space ==="
            df -h / || true
            echo ""
            echo "=== mounted volumes ==="
            mount | grep docker || echo "NO DOCKER MOUNTS"
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Commit diagnostics report
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add ci-diagnostics.txt
          git commit -m "ci: Docker diagnostics report [skip ci]"
          git push
