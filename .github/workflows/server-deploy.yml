name: Build Server Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/Dockerfile'
      - 'server/tsconfig.json'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: git.unveiledsoftwaresolutions.com
  IMAGE: git.unveiledsoftwaresolutions.com/jariah/ateliercode-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest ./server
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

      - name: Update Helm values
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i '13s/tag: ".*"/tag: "'"${SHORT_SHA}"'"/' server/helm/values.yaml

      - name: Commit and push
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          if git diff --quiet server/helm/values.yaml; then
            echo "No changes to commit"
          else
            git add server/helm/values.yaml
            git commit -m "chore: update server image tag to ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
