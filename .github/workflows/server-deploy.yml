name: Build Server Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/Dockerfile'
      - 'server/tsconfig.json'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: git.unveiledsoftwaresolutions.com
  IMAGE_NAME: jariah/ateliercode-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run type check
        run: npx tsc --noEmit
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Helm values with new image tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i '13s/tag: ".*"/tag: "'"${SHORT_SHA}"'"/' server/helm/values.yaml

      - name: Commit and push changes
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          if git diff --quiet server/helm/values.yaml; then
            echo "No changes to commit"
          else
            git add server/helm/values.yaml
            git commit -m "chore: update server image tag to ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
