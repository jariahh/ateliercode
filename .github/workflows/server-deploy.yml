name: Build Server Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/Dockerfile'
      - 'server/tsconfig.json'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin
          docker build -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-server:$SHORT_SHA -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-server:latest ./server
          docker push git.unveiledsoftwaresolutions.com/jariah/ateliercode-server:$SHORT_SHA
          docker push git.unveiledsoftwaresolutions.com/jariah/ateliercode-server:latest

      - name: Update Helm and push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i '13s/tag: ".*"/tag: "'"${SHORT_SHA}"'"/' server/helm/values.yaml
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add server/helm/values.yaml
          git diff --staged --quiet || git commit -m "chore: update server image tag to ${SHORT_SHA} [skip ci]"
          git push
