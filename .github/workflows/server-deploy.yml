name: Build Server Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/Dockerfile'
      - 'server/tsconfig.json'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jariahh/ateliercode-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run type check
        run: npx tsc --noEmit
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values with new image tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Update ONLY the main image tag (line 13 in values.yaml)
          sed -i '13s/tag: ".*"/tag: "'"${SHORT_SHA}"'"/' server/helm/values.yaml
          echo "Updated image tag to: ${SHORT_SHA}"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet server/helm/values.yaml; then
            echo "No changes to commit"
          else
            git add server/helm/values.yaml
            git commit -m "chore: update server image tag to ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
