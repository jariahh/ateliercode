name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for relevant changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- website/ .github/workflows/deploy-website.yml 2>/dev/null || echo "FORCE")
          if [ -z "$CHANGED" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: steps.changes.outputs.skip != 'true'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login git.unveiledsoftwaresolutions.com -u ${{ github.actor }} --password-stdin
          docker build -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-website:$SHORT_SHA -t git.unveiledsoftwaresolutions.com/jariah/ateliercode-website:latest ./website
          docker push git.unveiledsoftwaresolutions.com/jariah/ateliercode-website:$SHORT_SHA
          docker push git.unveiledsoftwaresolutions.com/jariah/ateliercode-website:latest

      - name: Update Helm and push
        if: steps.changes.outputs.skip != 'true'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/tag: \".*\"/tag: \"${SHORT_SHA}\"/" website/helm/values.yaml
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          git add website/helm/values.yaml
          git diff --staged --quiet || git commit -m "chore: update website image tag to ${SHORT_SHA} [skip ci]"
          git push
