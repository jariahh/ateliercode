name: Build Website Image

on:
  push:
    branches:
      - master
    paths:
      - 'website/src/**'
      - 'website/public/**'
      - 'website/package.json'
      - 'website/vite.config.ts'
      - 'website/Dockerfile'
      - 'website/nginx.conf'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: git.unveiledsoftwaresolutions.com
  IMAGE: git.unveiledsoftwaresolutions.com/jariah/ateliercode-website

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest ./website
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

      - name: Update Helm values
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/tag: \".*\"/tag: \"${SHORT_SHA}\"/" website/helm/values.yaml

      - name: Commit and push
        run: |
          git config --local user.email "forgejo-actions[bot]@unveiledsoftwaresolutions.com"
          git config --local user.name "forgejo-actions[bot]"
          if git diff --quiet website/helm/values.yaml; then
            echo "No changes to commit"
          else
            git add website/helm/values.yaml
            git commit -m "chore: update website image tag to ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
